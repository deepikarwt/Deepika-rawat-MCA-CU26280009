<!DOCTYPE html>
<html>
<head>
    <title>Student Grade</title>
</head>
<body>
    <h2>Student Grade Calculator</h2>

    <input type="number" id="marks" placeholder="Enter marks">
    <button onclick="findGrade()">Find Grade</button>

    <p id="result"></p>

    <script>
        function findGrade() {
            let marks = Number(document.getElementById("marks").value);
            let grade;

            if (marks < 0 || marks > 100 || 
                document.getElementById("marks").value === "") {
                grade = "Invalid Marks";
            } else if (marks >= 90) {
                grade = "A";
            } else if (marks >= 80) {
                grade = "B";
            } else if (marks >= 70) {
                grade = "C";
            } else if (marks >= 60) {
                grade = "D";
            } else {
                grade = "F";
            }

            switch (grade) {
                case "A":
                    console.log("Excellent");
                    break;
                case "B":
                    console.log("Very Good");
                    break;
                case "C":
                    console.log("Good");
                    break;
                case "D":
                    console.log("Pass");
                    break;
                case "F":
                    console.log("Fail");
                    break;
                default:
                    console.log("Invalid Marks");
            }

            document.getElementById("result").innerHTML =
                "Grade: " + grade;
        }
    </script>
</body>
</html>
